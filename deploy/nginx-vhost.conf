# CloudPanel vhost additions for digitizerpress.faisalkhan.cloud
#
# Paste the two location blocks into the site's Vhost editor in CloudPanel:
#   Sites -> digitizerpress.faisalkhan.cloud -> Vhost
# Put them inside the existing `server { ... }` block that already handles 443.
# Leave CloudPanel's own SSL, security and log directives alone.
#
# WHY ONE DOMAIN RATHER THAN TWO.
#
# The browser calls the API directly, not through the Next.js server, so the
# API has to be publicly reachable. Giving it its own subdomain would work and
# would also mean a cross-origin request on every call: a CORS preflight before
# each one, plus CORS_ORIGIN to keep in sync with the deployed hostname.
#
# Routing /api/ on the same domain avoids all of it. Same origin means no
# preflight, no CORS configuration that can drift, and NEXT_PUBLIC_API_URL can
# be the site's own address. The app's routes are /, /generate and /library, so
# the /api/ prefix is free.

# --- The NestJS gateway -----------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:4000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The rate limiter keys on this, and main.ts sets `trust proxy`. The two
    # have to agree or every visitor shares one bucket.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generation takes minutes, and a bulk job's batch poll can sit far longer.
    # nginx defaults to 60s, which cuts a working request off mid-article and
    # looks exactly like a hang.
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # A bulk job posts every brief at once; main.ts accepts 20mb.
    client_max_body_size 20m;

    # Progress polling wants each response as it is ready, not batched.
    proxy_buffering off;
}

# --- The Next.js frontend ---------------------------------------------------
location / {
    proxy_pass http://127.0.0.1:3000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next's dev overlay and any future streaming need the connection upgraded.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 300s;
}

# The scorer on 127.0.0.1:8000 is deliberately absent. It has no
# authentication of any kind and must never be exposed.
