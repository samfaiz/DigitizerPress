# Complete CloudPanel vhost for digitizerpress.faisalkhan.cloud
#
# Paste this over the ENTIRE contents of the Vhost editor:
#   CloudPanel -> Sites -> digitizerpress.faisalkhan.cloud -> Vhost
#
# The site was created as a PHP site, so CloudPanel's template serves files
# from disk and hands anything else to Varnish and PHP-FPM. None of that
# applies here: there is no PHP, and every request belongs to one of two Node
# processes. What follows keeps CloudPanel's placeholders, SSL and logging and
# replaces the routing.
#
# PORTS ARE NOT THE DEFAULTS. This VPS hosts other sites and they already held
# 4000 and 3000:
#   4000 -> /home/webinvite/htdocs/webinvite.co/backend  (another site)
#   3000 -> another next-server
# So this app runs on 4100 (gateway) and 3100 (frontend). Those numbers must
# match API_PORT in .env and --port in digitizerpress-web.service.

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name digitizerpress.faisalkhan.cloud;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  # --- Never serve anything from disk --------------------------------------
  #
  # The document root is the git checkout, and it contains .env with the
  # Anthropic key in it. Deny dotfiles explicitly rather than relying on no
  # other rule happening to match them.
  location ~ /\. {
    deny all;
    return 404;
  }

  # --- Next.js assets ------------------------------------------------------
  #
  # `^~` is load-bearing. nginx evaluates regex locations BEFORE plain prefix
  # ones, so CloudPanel's default
  #     location ~* ^.+\.(css|js|jpg|...)$
  # would win over `location /` and look every script and stylesheet up on
  # disk, where they do not exist. The result is a page that loads as
  # unstyled HTML and does nothing. `^~` tells nginx to stop checking regexes
  # once this prefix matches. That static block is deleted below anyway, but
  # this keeps the site working if CloudPanel ever regenerates it.
  location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # --- The NestJS gateway --------------------------------------------------
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4100;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # The rate limiter keys on this and main.ts sets `trust proxy`. The two
    # have to agree or every visitor shares one bucket.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generating an article takes minutes and a bulk job's batch poll far
    # longer. CloudPanel's 720s default severs a working request in a way
    # that looks exactly like a hang.
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    # A bulk job posts every brief at once; main.ts accepts 20mb.
    client_max_body_size 20m;

    # Progress polling wants each response as it is ready, not buffered.
    proxy_buffering off;
  }

  # --- Everything else is the Next.js app ----------------------------------
  location / {
    proxy_pass http://127.0.0.1:3100;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    proxy_redirect off;
    proxy_read_timeout 300s;
  }

  # Deliberately removed from CloudPanel's template:
  #
  #   location ~* ^.+\.(css|js|...)$   served repo files from disk and broke
  #                                    every Next.js asset request
  #   {{varnish_proxy_pass}}           Varnish fronts PHP, and there is none
  #   if (-f $request_filename) break; only meaningful when serving files
  #
  # The scorer on 127.0.0.1:8000 is absent on purpose. It has no
  # authentication of any kind and must never be reachable from outside.
}

# The PHP-FPM block CloudPanel generates for this site type. Nothing uses it,
# there is no PHP in this project, and it is kept only so CloudPanel's tooling
# still recognises the file.
#
# Two changes from the generated version, both about the document root now
# being a git repo that contains .env:
#   - bound to 127.0.0.1 rather than every interface, so it is not reachable
#     as http://<server-ip>:8080/ by anything off this machine
#   - dotfiles denied
server {
  listen 127.0.0.1:8080;
  server_name digitizerpress.faisalkhan.cloud;
  {{root}}

  include /etc/nginx/global_settings;

  location ~ /\. {
    deny all;
    return 404;
  }

  try_files $uri $uri/ /index.php?$args;
  index index.php index.html;

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_intercept_errors on;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    try_files $uri =404;
    fastcgi_read_timeout 3600;
    fastcgi_send_timeout 3600;
    fastcgi_param HTTPS "on";
    fastcgi_param SERVER_PORT 443;
    fastcgi_pass 127.0.0.1:{{php_fpm_port}};
    fastcgi_param PHP_VALUE "{{php_settings}}";
  }

  if (-f $request_filename) {
    break;
  }
}
